<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이용약관 - 소소타임</title>
    <meta name="description" content="소소타임 서비스 이용 기준과 콘텐츠 운영 원칙 안내입니다." />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="board-main">
        <div class="board-toolbar">
          <div>
            <p class="eyebrow">TERMS</p>
            <h1>이용약관</h1>
          </div>
        </div>
        <div class="dialog-card">
          <p>
            소소타임은 공개 커뮤니티의 흐름을 참고해 자체적으로 작성한 요약, 해설, 생활 정보성
            콘텐츠를 제공합니다.
          </p>
          <p>
            게시글은 원문을 대체하지 않으며, 필요한 경우 출처 링크를 통해 원문 맥락을 확인할 수
            있습니다.
          </p>
          <p>
            권리 침해, 부정확한 정보, 부적절한 표현이 발견되면 문의 페이지를 통해 정정 또는 삭제를
            요청할 수 있습니다.
          </p>
          <p><a href="/">홈으로 돌아가기</a></p>
        </div>
      </section>
    </main>
